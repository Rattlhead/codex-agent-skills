interface:
  display_name: "Менеджер субагентов"
  short_description: "Маршрутизация, делегирование и приёмка работы"
  default_prompt: "Используй $subagent-manager как менеджер субагентов. Выбери маршрут по цели, области и риску. Делегируй выполнение и принимай результаты по доказательствам. Сохрани исключение для короткой самостоятельной цели целиком через $task-model-router."
policy:
  allow_implicit_invocation: true
