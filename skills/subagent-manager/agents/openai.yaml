interface:
  display_name: "Менеджер субагентов"
  short_description: "Решение о делегировании и приёмка работы"
  default_prompt: "Используй $subagent-manager. Сначала попроси $task-model-router решить, справится ли основной агент сам или нужны субагенты. Если нужны субагенты, раздели работу на части и задай критерии приёмки. Координируй исполнителей. Проверь и прими результаты."
policy:
